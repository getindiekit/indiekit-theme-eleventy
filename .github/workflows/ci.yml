name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_DOWNLOADS_OFFLINE: "1"
      SPEEDLIFY_OFFLINE: "1"
      WEBMENTIONS_FIXTURE: test/fixtures/webmentions.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
